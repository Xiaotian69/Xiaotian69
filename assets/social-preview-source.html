<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Xiaotian69 social preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
    body { color: #f8fafc; font-family: Inter, "Segoe UI", sans-serif; background: radial-gradient(circle at 80% 18%, rgba(34,211,238,.2), transparent 32%), radial-gradient(circle at 72% 90%, rgba(52,211,153,.13), transparent 34%), linear-gradient(126deg, #070d18, #0b1524 55%, #08202a); }
    .canvas { position: relative; width: 100%; height: 100%; padding: 78px 86px; display: grid; grid-template-columns: 660px 1fr; gap: 48px; align-items: center; isolation: isolate; }
    .canvas::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .25; background-image: linear-gradient(rgba(34,211,238,.11) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,.11) 1px, transparent 1px); background-size: 54px 54px; mask-image: linear-gradient(90deg, #000, transparent 76%); }
    .identity { display: flex; align-items: center; gap: 15px; margin-bottom: 52px; font-size: 25px; font-weight: 800; letter-spacing: .08em; }
    .mark { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 16px; color: #04131b; background: linear-gradient(135deg, #67e8f9, #6ee7b7); font-size: 18px; font-weight: 900; }
    .kicker { margin: 0 0 18px; color: #67e8f9; font-size: 15px; font-weight: 800; letter-spacing: .21em; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 62px; line-height: 1.03; letter-spacing: -.035em; font-weight: 500; }
    .focus { margin: 25px 0 0; max-width: 640px; color: rgba(248,250,252,.72); font-size: 20px; line-height: 1.5; }
    .loop { position: relative; width: 390px; height: 390px; border: 1px solid rgba(103,232,249,.27); border-radius: 50%; }
    .node { position: absolute; width: 184px; padding: 17px 18px; border: 1px solid rgba(255,255,255,.15); border-radius: 17px; background: rgba(14,29,44,.96); box-shadow: 0 22px 46px rgba(0,0,0,.32); }
    .node small { display: block; margin-bottom: 6px; color: #6ee7b7; font-size: 10px; font-weight: 800; letter-spacing: .14em; }
    .node strong { font-size: 19px; }
    .n1 { left: -38px; top: 30px; } .n2 { right: -38px; top: 153px; } .n3 { left: 18px; bottom: 11px; }
    .dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #67e8f9; right: 46px; top: 35px; box-shadow: 0 0 22px rgba(103,232,249,.75); }
  </style>
</head>
<body>
  <main class="canvas">
    <section>
      <div class="identity"><span class="mark">XT</span><span>XIAOTIAN69</span></div>
      <p class="kicker">AI PRODUCT BUILDER</p>
      <h1>From product truth<br>to working software.</h1>
      <p class="focus">Human-centered AI products · Learning tools · Practical experiments</p>
    </section>
    <section class="loop"><span class="dot"></span><article class="node n1"><small>DEFINE</small><strong>Problem & value</strong></article><article class="node n2"><small>DESIGN</small><strong>Interface & loop</strong></article><article class="node n3"><small>SHIP</small><strong>Code & evidence</strong></article></section>
  </main>
</body>
</html>
